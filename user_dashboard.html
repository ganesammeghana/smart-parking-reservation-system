<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" href="index.html">Smart Parking</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white" href="my_bookings.html">My Bookings</a>
            <a class="nav-link text-white" href="index.html" onclick="logout()">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center text-success mb-4">
            Book Parking Slot
        </h2>

        <h4 class="text-center mt-4 mb-3">
    Select Parking Slot
</h4>

<div id="slotContainer" class="d-flex flex-wrap gap-2 justify-content-center mb-4">

</div>
        <form id="bookingForm" novalidate>

            <div class="mb-3">
                <label>Name</label>
                <input type="text" id="name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Vehicle Number</label>
                <input type="text" id="vehicle_number" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Slot Number</label>
                <input type="number" id="slot_number" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Booking Date</label>
                <input type="date" id="booking_date" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Booking Time</label>
                <input type="time" id="booking_time" class="form-control" required>
            </div>

           <button type="submit" class="btn btn-success w-100">
    Book Slot
</button>

        </form>

    </div>

</div>

<footer class="text-center mt-5 p-3 bg-dark text-white">
    © 2026 Smart Parking Reservation System
</footer>

<script src="script.js"></script>

<script>
function logout() {
    localStorage.removeItem("username");
    localStorage.removeItem("receipt");
}
</script>
</body>
</html>
