<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Booking</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="index.html">Smart Parking</a>

        <div class="ms-auto navbar-nav">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link" href="view_bookings.html">View Bookings</a>
            <a class="nav-link active" href="edit_booking.html">Edit Booking</a>
            <a class="nav-link" href="dashboard.html">Dashboard</a>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4 text-primary">
            Edit Booking
        </h2>

        <form id="editForm">

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" id="name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Vehicle Number</label>
                <input type="text" id="vehicle_number" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Slot Number</label>
                <input type="number" id="slot_number" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Booking Date</label>
                <input type="date" id="booking_date" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Booking Time</label>
                <input type="time" id="booking_time" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-success w-100">
                Update Booking
            </button>

        </form>

    </div>

</div>

<!-- Footer -->
<footer class="text-center mt-5 p-3 bg-dark text-white">
    © 2026 Smart Parking Reservation System
</footer>

<script src="edit_booking.js"></script>

</body>
</html>
