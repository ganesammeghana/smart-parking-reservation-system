<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Booking Receipt</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow p-4">

<h2 class="text-center text-success">
Parking Booking Receipt
</h2>

<hr>

<p><strong>Name :</strong> <span id="name"></span></p>

<p><strong>Vehicle :</strong> <span id="vehicle"></span></p>

<p><strong>Slot :</strong> <span id="slot"></span></p>

<p><strong>Date :</strong> <span id="date"></span></p>

<p><strong>Time :</strong> <span id="time"></span></p>

<hr>

<div class="text-center my-4">
    <h5>Booking QR Code</h5>
    <div id="qrcode"></div>
</div>

<div class="text-center">

<button class="btn btn-primary" onclick="window.print()">
Print Receipt
</button>

<a href="user_dashboard.html" class="btn btn-success">
Back
</a>

</div>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>

const booking = JSON.parse(localStorage.getItem("receipt"));

document.getElementById("name").innerHTML = booking.name;
document.getElementById("vehicle").innerHTML = booking.vehicle_number;
document.getElementById("slot").innerHTML = booking.slot_number;
document.getElementById("date").innerHTML = booking.booking_date;
document.getElementById("time").innerHTML = booking.booking_time;

const qrText =
`Name: ${booking.name}
Vehicle: ${booking.vehicle_number}
Slot: ${booking.slot_number}
Date: ${booking.booking_date}
Time: ${booking.booking_time}`;

new QRCode(document.getElementById("qrcode"), {
    text: qrText,
    width: 180,
    height: 180
});

</script>

</body>
</html>
